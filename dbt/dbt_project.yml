name: denguewatch
version: "1.0.0"
config-version: 2
profile: denguewatch

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"        # compiled SQL + docs (gitignored)
clean-targets: ["target", "dbt_packages"]

models:
  denguewatch:
    staging:
      +materialized: view    # light, always fresh
      +schema: staging
    marts:
      +materialized: table   # what dashboards / ML read
      +schema: gold
