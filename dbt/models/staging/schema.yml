version: 2

models:
  - name: stg_ndcu_weekly
    description: NDCU weekly cases per RDHS (26 regions) with district; ISO weeks (Mon-Sun).
    data_tests:
      - unique_combination:
          arguments:
            columns: [iso_week_key, rdhs]
    columns:
      - name: rdhs
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('silver', 'dim_rdhs')
                field: rdhs
      - name: district
        description: Null means the RDHS is missing from reference/rdhs.csv.
        data_tests: [not_null]
      - name: cases_this_week
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: 0}

  - name: stg_wer_weekly
    description: WER dengue history per RDHS per reported week (denguedatahub, pinned).
    data_tests:
      - unique_combination:
          arguments:
            columns: [week_start, rdhs]
    columns:
      - name: district
        data_tests: [not_null]
      - name: cases
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: 0}
      - name: week_days
        description: Days in the reported week. Normally 7; the source has a few irregular 2009 weeks (5-8 days).
        data_tests:
          - in_range:
              arguments: {min_value: 5, max_value: 8}
          - in_range:
              name: wer_week_is_not_7_days
              arguments: {min_value: 7, max_value: 7}
              config: {severity: warn}
