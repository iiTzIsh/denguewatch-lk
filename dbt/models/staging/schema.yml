version: 2

models:
  - name: stg_ndcu_weekly
    description: NDCU weekly cases per RDHS (26 regions) with district. ISO weeks Mon->Sun.
    data_tests:
      - unique_combination:
          arguments:
            columns: [iso_week_key, rdhs]
    columns:
      - name: rdhs
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('silver', 'dim_rdhs')
                field: rdhs
      - name: district
        description: null would mean an RDHS missing from reference/rdhs.csv
        data_tests: [not_null]
      - name: cases_this_week
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: 0}
