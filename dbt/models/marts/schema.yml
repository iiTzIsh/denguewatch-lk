version: 2

models:
  - name: dim_epi_week
    description: Sri Lankan epidemiological weeks (Saturday -> Friday).
    columns:
      - name: epi_week_key
        description: e.g. 2024-W18
        data_tests: [unique, not_null]
      - name: week_start
        data_tests: [unique, not_null]
      - name: season
        data_tests:
          - accepted_values:
              arguments:
                values: ['NE monsoon', 'First inter-monsoon', 'SW monsoon', 'Second inter-monsoon']

  - name: dim_district
    description: District dimension (25 districts) with hash surrogate key and an 'unknown' member (-1).
    columns:
      - name: district_sk
        data_tests: [unique, not_null]
      - name: district
        data_tests: [unique, not_null]
      - name: province
        data_tests:
          - accepted_values:
              arguments:
                values: ['Western', 'Central', 'Southern', 'Northern', 'Eastern', 'North Western',
                         'North Central', 'Uva', 'Sabaragamuwa', 'Unknown']

  - name: fact_weather_weekly
    description: Weekly weather per district. Grain = district x epi week.
    data_tests:
      - unique_combination:
          arguments:
            columns: [district_sk, epi_week_key]
    columns:
      - name: district_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_sk
          - not_unknown_member
      - name: epi_week_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_epi_week')
                field: epi_week_key
      - name: rainfall_mm_total
        data_tests:
          - in_range:
              arguments: {min_value: 0}
      - name: days_in_week
        data_tests:
          - in_range:
              arguments: {min_value: 1, max_value: 7}

  - name: dim_date
    description: Daily calendar 2006-2027; bridge between epi weeks (Sat-Fri) and ISO weeks (Mon-Sun). See docs/decisions/0001.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: epi_week_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_epi_week')
                field: epi_week_key
      - name: iso_week_key
        data_tests: [not_null]

  - name: fact_weather_iso_weekly
    description: Weekly weather per district on ISO weeks (Mon-Sun). Grain = district x ISO week.
    data_tests:
      - unique_combination:
          arguments:
            columns: [district_sk, iso_week_key]
    columns:
      - name: district_sk
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_sk
      - name: days_in_week
        data_tests:
          - in_range:
              arguments: {min_value: 1, max_value: 7}

  - name: fact_dengue_ndcu_weekly
    description: NDCU weekly cases per RDHS on ISO weeks, with restatement handling (cases_first_reported vs cases_latest).
    data_tests:
      - unique_combination:
          arguments:
            columns: [rdhs, iso_week_key]
    columns:
      - name: district_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_sk
      - name: cases_latest
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: 0}

  - name: mart_ndcu_monitoring
    description: District x ISO week monitoring view - cases, change vs last week, weather and 1-4 week rainfall lags.
    data_tests:
      - unique_combination:
          arguments:
            columns: [district_sk, iso_week_key]

  - name: fact_dengue_wer_weekly
    description: WER dengue history (2007->2026) per RDHS per reported week - training data for the forecasting model.
    data_tests:
      - unique_combination:
          arguments:
            columns: [rdhs, week_start]
    columns:
      - name: district_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_sk
