version: 2

models:
  - name: dim_epi_week
    description: Sri Lankan epidemiological weeks (Saturday-Friday).
    columns:
      - name: epi_week_key
        description: Epi year and week number, e.g. 2024-W18.
        data_tests: [unique, not_null]
      - name: week_start
        data_tests: [unique, not_null]
      - name: season
        data_tests:
          - accepted_values:
              arguments:
                values: ['NE monsoon', 'First inter-monsoon', 'SW monsoon', 'Second inter-monsoon']

  - name: dim_district
    description: District dimension (25 districts) with hash surrogate key and an 'unknown' member (-1).
    columns:
      - name: district_sk
        data_tests: [unique, not_null]
      - name: district
        data_tests: [unique, not_null]
      - name: province
        data_tests:
          - accepted_values:
              arguments:
                values: ['Western', 'Central', 'Southern', 'Northern', 'Eastern', 'North Western',
                         'North Central', 'Uva', 'Sabaragamuwa', 'Unknown']

  - name: fact_weather_weekly
    description: Weekly weather per district per epi week.
    data_tests:
      - unique_combination:
          arguments:
            columns: [district_sk, epi_week_key]
    columns:
      - name: district_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_sk
          - not_unknown_member
      - name: epi_week_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_epi_week')
                field: epi_week_key
      - name: rainfall_mm_total
        data_tests:
          - in_range:
              arguments: {min_value: 0}
      - name: days_in_week
        data_tests:
          - in_range:
              arguments: {min_value: 1, max_value: 7}

  - name: dim_date
    description: Daily calendar 2006-2027; bridge between epi weeks (Sat-Fri) and ISO weeks (Mon-Sun). See docs/decisions/0001.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: epi_week_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_epi_week')
                field: epi_week_key
      - name: iso_week_key
        data_tests: [not_null]

  - name: fact_weather_iso_weekly
    description: Weekly weather per district per ISO week (Mon-Sun).
    data_tests:
      - unique_combination:
          arguments:
            columns: [district_sk, iso_week_key]
    columns:
      - name: district_sk
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_sk
      - name: days_in_week
        data_tests:
          - in_range:
              arguments: {min_value: 1, max_value: 7}

  - name: fact_dengue_ndcu_weekly
    description: NDCU weekly cases per RDHS on ISO weeks, with restatement handling (cases_first_reported vs cases_latest).
    data_tests:
      - unique_combination:
          arguments:
            columns: [rdhs, iso_week_key]
    columns:
      - name: district_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_sk
      - name: cases_latest
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: 0}

  - name: mart_ndcu_monitoring
    description: >
      Monitoring view per district per ISO week: cases, cases per 100,000 (Census 2024), change vs
      previous week, weather and 1-4 week rainfall lags.
    data_tests:
      - unique_combination:
          arguments:
            columns: [district_sk, iso_week_key]
    columns:
      - name: cases_per_100k
        data_tests:
          - in_range:
              arguments: {min_value: 0}
      - name: population
        data_tests:
          - in_range:
              arguments: {min_value: 1}

  - name: fact_dengue_wer_weekly
    description: WER dengue history (2007-2026) per RDHS per reported week; training data for the forecasting model.
    data_tests:
      - unique_combination:
          arguments:
            columns: [rdhs, week_start]
    columns:
      - name: district_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_sk

  - name: mart_ml_features
    description: >
      ML training and scoring table per RDHS per week (WER history, then NDCU weeks after WER ends).
      Features use only data up to week_end; targets are cases 2 and 4 weeks later.
      Lags/leads are date-checked; weather windows with a missing day are NULL.
    data_tests:
      - unique_combination:
          arguments:
            columns: [rdhs, week_start]
    columns:
      - name: district_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_sk
      - name: cases
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: 0}
      - name: case_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['WER', 'NDCU']
      - name: rainy_days_4w
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 28}
      - name: rain_w0_mm
        data_tests:
          - in_range:
              arguments: {min_value: 0}
      - name: month
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: 1, max_value: 12}

  - name: mart_forecast_accuracy
    description: Forecast vs actual per region, horizon and model version, alongside the naive forecast.
    data_tests:
      - unique_combination:
          arguments:
            columns: [rdhs, model_version, horizon_weeks, base_week_end]
    columns:
      - name: horizon_weeks
        data_tests:
          - accepted_values:
              arguments:
                values: [2, 4]
      - name: abs_error
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: 0}
      - name: risk_level
        data_tests:
          - accepted_values:
              arguments:
                values: ['high', 'watch', 'normal', 'unknown']

  - name: fact_dengue_moh_weekly
    description: >
      High-risk MOH areas per NDCU week (page 2 of the weekly update), joined point-in-time to the SCD2
      region dimension. An area missing from a week was not high-risk, not zero cases.
    data_tests:
      - unique_combination:
          arguments:
            columns: [moh_key, week_start]
    columns:
      - name: region_sk
        description: Version of the MOH area valid that week; never null (SCD2 integrity).
        data_tests: [not_null]
      - name: district_sk
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_sk
      - name: cases_this_week
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: 0, max_value: 5000}
