version: 2

models:
  - name: dim_epi_week
    description: Sri Lankan epidemiological weeks (Saturday -> Friday).
    columns:
      - name: epi_week_key
        description: e.g. 2024-W18
        data_tests: [unique, not_null]
      - name: week_start
        data_tests: [unique, not_null]
      - name: season
        data_tests:
          - accepted_values:
              arguments:
                values: ['NE monsoon', 'First inter-monsoon', 'SW monsoon', 'Second inter-monsoon']

  - name: dim_district
    description: District dimension (25 districts) with hash surrogate key and an 'unknown' member (-1).
    columns:
      - name: district_sk
        data_tests: [unique, not_null]
      - name: district
        data_tests: [unique, not_null]
      - name: province
        data_tests:
          - accepted_values:
              arguments:
                values: ['Western', 'Central', 'Southern', 'Northern', 'Eastern', 'North Western',
                         'North Central', 'Uva', 'Sabaragamuwa', 'Unknown']

  - name: fact_weather_weekly
    description: Weekly weather per district. Grain = district x epi week.
    data_tests:
      - unique_combination:
          arguments:
            columns: [district_sk, epi_week_key]
    columns:
      - name: district_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_district')
                field: district_sk
          - not_unknown_member
      - name: epi_week_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_epi_week')
                field: epi_week_key
      - name: rainfall_mm_total
        data_tests:
          - in_range:
              arguments: {min_value: 0}
      - name: days_in_week
        data_tests:
          - in_range:
              arguments: {min_value: 1, max_value: 7}
