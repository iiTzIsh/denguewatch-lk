version: 2

sources:
  - name: silver
    description: Tables loaded by the Python pipeline (src/load/duckdb_load.py)
    schema: main
    tables:
      - name: weather_daily
        description: One row per district per day (newest pull wins), Open-Meteo era5_seamless
      - name: weather_weekly
        description: One row per district per Sat->Fri epi week
      - name: dim_district
        description: 25 districts with centroids, from reference/districts.csv (geoBoundaries/OSM)
      - name: dim_rdhs
        description: 26 RDHS regions (25 districts, Ampara split into Ampara + Kalmunai) -> district
      - name: ndcu_weekly_cases
        description: Parsed NDCU weekly update PDFs. ISO weeks (Monday -> Sunday), one row per RDHS per week.
      - name: wer_weekly_cases
        description: >
          WER dengue history 2007->2026 per RDHS, from the denguedatahub R package (pinned commit), itself extracted
          from the Epidemiology Unit's Weekly Epidemiological Reports. Sat->Fri epi weeks up to 2025; Mon->Sun in 2026.

  - name: scd2
    description: SCD Type 2 table maintained incrementally by src/transform/scd2.py
    schema: gold
    tables:
      - name: dim_region
