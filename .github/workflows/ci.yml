# Lint and unit tests, then the pipeline on sample data and DAG integrity; the web build runs in parallel.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DO_NOT_TRACK: "true"          # disables MLflow usage telemetry

jobs:
  lint-and-test:
    name: Lint + type check + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-api.txt -r requirements-ml.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy src
      - name: Unit tests (pytest)
        run: pytest -v

  pipeline:
    name: Pipeline + dbt build on sample data
    needs: lint-and-test
    runs-on: ubuntu-latest
    env:
      DW_DATA_DIR: ${{ github.workspace }}/ci_data
      DW_LOG_DIR: ${{ github.workspace }}/ci_logs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dbt.txt
      - name: Build sample bronze data
        run: python -m tests.ci.make_sample_data
      - name: Run pipeline (parse -> silver -> SCD2 -> dbt build with all data tests)
        run: python -m src.pipeline

  dags:
    name: Airflow DAG integrity
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Airflow 3.3.2 (official constraints) + project packages
        run: |
          pip install "apache-airflow==3.3.2" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt"
          pip install "apache-airflow==3.3.2" -r requirements.txt
      - name: DAG tests
        run: pytest tests/test_dags.py -v

  web:
    name: Web dashboard (type check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (exact versions from package-lock.json)
        run: npm ci
      - name: Type check + production build
        run: npm run build
