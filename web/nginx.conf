# Serves the built React app and forwards /api/* to the FastAPI container (same origin: no CORS needed).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000/;          # trailing slash: /api/health -> /health
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # built files have a content hash in their name -> cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
