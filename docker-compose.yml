# DengueWatch LK stack:   docker compose up -d
#
#   mlflow     model tracking + registry             http://localhost:5000
#   init       one-time setup: data, dbt, model, forecasts (src/bootstrap.py), then exits
#   api        starts after init has finished        http://localhost:8000/docs
#   web        React dashboard (nginx -> api)        http://localhost:3000
#
# Setup progress:         docker compose logs -f init
# Re-run setup:           docker compose run --rm init --force
# One-off pipeline run:   docker compose run --rm pipeline
# Weekly automation:      docker compose -f docker-compose.airflow.yml up -d

x-app: &app
  build: .                        # each app service can build the shared image
  image: denguewatch-app
  volumes:
    - ./data:/app/data
    - ./logs:/app/logs
  environment: &app-env
    DW_DATA_DIR: /app/data
    DW_LOG_DIR: /app/logs
    MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  mlflow:
    # Metadata in SQLite, artifacts in ./mlflow/artifacts; the server proxies artifact uploads,
    # so clients only need HTTP access.
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts localhost,localhost:5000,127.0.0.1:5000,mlflow,mlflow:5000,host.docker.internal:5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow
    environment:
      MLFLOW_DISABLE_TELEMETRY: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  init:
    <<: *app
    entrypoint: ["python", "-m", "src.bootstrap"]   # no-op if already set up
    command: []
    env_file:
      - path: .env
        required: false
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    # nginx serves the built React app and proxies /api/* to the api service
    build: ./web
    image: denguewatch-web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  pipeline:
    <<: *app
    command: ["python", "-m", "src.pipeline"]
    profiles: ["manual"]
    depends_on:
      mlflow:
        condition: service_healthy
